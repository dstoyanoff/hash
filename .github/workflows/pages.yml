name: Docs site

# The @hashsome/ui component gallery at the site root and the example as a live demo under /demo/,
# built as one static site and served by GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces an older one that has not finished.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hashsome/ui docs:build
        env:
          # Served from https://<owner>.github.io/<repo>/
          DOCS_BASE: /${{ github.event.repository.name }}/
      - run: pnpm --filter @hashsome/demo build
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/demo/
      - name: Put the demo under /demo/
        run: |
          cp -r demo/build/client packages/ui/docs/dist/demo
          # Pages serves 404.html for any unknown path, so a reload on a demo page (a single-page
          # app route) still loads the demo.
          cp demo/build/client/index.html packages/ui/docs/dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/ui/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
